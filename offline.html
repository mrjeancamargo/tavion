<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You're offline – Tavion</title>
<meta name="theme-color" content="#0b0f19">
<link rel="icon" href="/images/favicon.png" type="image/png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f19; color: #f1f5f9; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 26px; margin: 16px 0 6px; }
  p { color: #94a3b8; margin: 0 0 20px; }
  a, button { display: inline-block; min-height: 48px; padding: 12px 22px; border-radius: 12px; border: 0; background: #38bdf8; color: #06121c; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/images/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Pages you've opened before still work. Connect to the internet to use everything else.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
